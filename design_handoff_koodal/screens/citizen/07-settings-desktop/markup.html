<sc-if value="{{ pEditOpen }}"><div style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line);animation:cp-row .25s ease-out both"><label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)">NAME</span><input value="{{ pName }}" onChange="{{ onPName }}" placeholder="Your name" style="height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--cp-line);background:var(--cp-bg);color:var(--cp-ink);font:500 14px/1 Outfit,sans-serif;outline:none;box-sizing:border-box;width:100%"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)">AREA / WARD</span><input value="{{ pArea }}" onChange="{{ onPArea }}" placeholder="e.g. Velachery, Chennai" style="height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--cp-line);background:var(--cp-bg);color:var(--cp-ink);font:500 14px/1 Outfit,sans-serif;outline:none;box-sizing:border-box;width:100%"></label><div style="display:flex;gap:10px"><button onClick="{{ togglePEdit }}" style="flex:3;min-width:0;height:54px;border-radius:999px;border:1px solid var(--cp-line);background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));color:var(--cp-ink);font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .12s;" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent">Cancel</button><button data-glare="1" onClick="{{ saveProfile }}" style="flex:7;min-width:0;height:54px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 15px/1 Outfit,sans-serif;letter-spacing:.01em;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .2s;" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent">Save profile</button></div></div></sc-if>

<div style="display:flex;flex-direction:column;gap:8px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3);padding:0 4px">PREFERENCES</span><div style="border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line);overflow:hidden"><sc-for list="{{ setToggles }}" as="r"><button onClick="{{ r.pick }}" style="display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:none;border-bottom:1px solid var(--cp-line);background:transparent;color:var(--cp-ink);cursor:pointer;text-align:left"><span style="width:38px;height:38px;flex:none;border-radius:12px;background:var(--cp-surface-2);display:grid;place-items:center;font-size:18px"><i class="ph-bold {{ r.icon }}"></i></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:600 13.5px/1.1 Outfit,sans-serif">{{ r.l }}</span><span style="font:500 12.5px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">{{ r.sub }}</span></span><span style="position:relative;width:46px;height:28px;border-radius:14px;background:{{ r.tbg }};transition:background .2s;flex:none"><span style="position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transform:{{ r.tx }};transition:transform .3s cubic-bezier(.3,1.6,.5,1)"></span></span></button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3);padding:0 4px">LANGUAGE</span><div style="display:flex;gap:3px;padding:3px;border-radius:14px;background:var(--cp-surface-2)"><sc-for list="{{ langSeg }}" as="sb"><button onClick="{{ sb.pick }}" style="flex:1;height:40px;border:none;border-radius:999px;background:{{ sb.bg }};box-shadow:{{ sb.sh }};color:var(--cp-ink);font:600 13px/1 Outfit,'Noto Sans Tamil',sans-serif;cursor:pointer;transition:background .15s">{{ sb.l }}</button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3);padding:0 4px">ACCOUNT</span><div style="border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line);overflow:hidden"><div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--cp-line)"><span style="width:38px;height:38px;flex:none;border-radius:12px;background:var(--cp-surface-2);display:grid;place-items:center;font-size:18px"><i class="ph-bold ph-identification-badge"></i></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:600 13.5px/1.1 Outfit,sans-serif">Identity verified</span><span style="font:500 12.5px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">{{ verifiedLine }}</span></span><i class="ph-fill ph-seal-check" style="color:var(--cp-peacock);font-size:20px"></i></div><div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--cp-line)"><span style="width:38px;height:38px;flex:none;border-radius:12px;background:var(--cp-surface-2);display:grid;place-items:center;font-size:18px"><i class="ph-bold ph-phone"></i></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:600 13.5px/1.1 Outfit,sans-serif">Mobile number</span><span style="font:500 12.5px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">{{ mePhone }}</span></span><i class="ph-bold ph-lock-simple" style="color:var(--cp-ink-3)"></i></div><div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--cp-line)"><span style="width:38px;height:38px;flex:none;border-radius:12px;background:var(--cp-surface-2);display:grid;place-items:center;font-size:18px"><i class="ph-bold ph-shield-check"></i></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font:600 13.5px/1.1 Outfit,sans-serif">Data & privacy</span><span style="font:500 12.5px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">Your identity is never shown on anonymous posts</span></span><i class="ph-bold ph-caret-right" style="color:var(--cp-ink-3)"></i></div></div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button onClick="{{ helpT }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:20px;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));border:1px solid var(--cp-line);cursor:pointer;text-align:left;color:var(--cp-ink);min-height:96px"><i class="ph-bold ph-lifebuoy" style="font-size:20px"></i><span style="font:600 13.5px/1.1 Outfit,sans-serif">Help & feedback</span><span style="font:500 12px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">FAQs, contact support</span></button><button onClick="{{ aboutT }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:20px;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));border:1px solid var(--cp-line);cursor:pointer;text-align:left;color:var(--cp-ink);min-height:96px"><i class="ph-bold ph-info" style="font-size:20px"></i><span style="font:600 13.5px/1.1 Outfit,sans-serif">About</span><span style="font:500 12px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">Koodal v1.0 · terms</span></button></div>
<div style="display:flex;gap:10px"><button onClick="{{ deleteAcct }}" style="flex:3;min-width:0;height:54px;border-radius:999px;border:1px solid var(--cp-line);background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));color:var(--cp-ink);font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .12s;color:var(--cp-pulse)" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent">Delete account</button><button data-glare="1" onClick="{{ logout }}" style="flex:7;min-width:0;height:54px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 15px/1 Outfit,sans-serif;letter-spacing:.01em;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .2s;" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-sign-out"></i> Log out</button></div>
<button onClick="{{ resetDemo }}" style="align-self:center;border:none;background:none;padding:6px 0;color:var(--cp-ink-3);font:600 12.5px/1 Outfit,sans-serif;cursor:pointer;display:flex;gap:6px;align-items:center"><i class="ph-bold ph-arrow-counter-clockwise"></i>Reset demo data</button></div></div></div></sc-if>
