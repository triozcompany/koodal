<!-- Koodal Citizen.dc.html · <sc-if value="{{ isAiM }}"> · chars 208448–212388 -->
<sc-if value="{{ isAiM }}">
    <div style="position:absolute;inset:0;padding:16px 20px 0;display:flex;flex-direction:column;gap:14px;animation:cp-in .38s cubic-bezier(.2,.9,.25,1.1) both">
      <div style="display:flex;align-items:center;gap:10px;height:44px">
        <div style="width:34px;height:34px;border-radius:10px;background:var(--cp-ink);color:var(--cp-bg);display:grid;place-items:center;font-size:18px"><i class="ph-fill ph-sparkle"></i></div>
        <div style="font:400 19px/1 'DM Serif Display',serif;letter-spacing:-.02em">{{ aiTitle }}</div>
      </div>
      <div style="position:relative;height:210px;border-radius:20px;border:1px solid var(--cp-line);overflow:hidden;background:repeating-linear-gradient(135deg,var(--cp-ph-a) 0 10px,var(--cp-ph-b) 10px 20px);flex:none">
        <div style="position:absolute;right:10px;top:10px;font:500 10.5px/1 Outfit,sans-serif;color:var(--cp-ink-2);background:var(--cp-surface);padding:5px 7px;border-radius:6px">your photo</div>
        <sc-if value="{{ aiScanning }}"><div style="position:absolute;left:0;right:0;height:3px;background:var(--cp-pulse);box-shadow:0 0 18px 4px color-mix(in oklch,var(--cp-pulse) 50%,transparent);animation:cp-scan 1.1s ease-in-out infinite alternate"></div></sc-if>
        <sc-if value="{{ aiBox }}"><div style="position:absolute;left:22%;top:32%;width:54%;height:44%;border:3px solid var(--cp-pulse);border-radius:12px;animation:cp-pop .4s cubic-bezier(.3,1.5,.5,1) both"><span style="position:absolute;left:-3px;top:-30px;height:24px;padding:0 8px;border-radius:7px;background:var(--cp-pulse);color:#fff;font:700 12px/24px Outfit,sans-serif;white-space:nowrap">{{ an.label }} · {{ an.p }}%</span></div></sc-if>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ aiRows }}" as="row">
          <div style="display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cp-line);animation:cp-row .4s cubic-bezier(.2,.9,.3,1.2) both">
            <div style="width:40px;height:40px;border-radius:12px;background:{{ row.bg }};display:grid;place-items:center;font-size:19px;color:var(--cp-ink)"><i class="ph-bold {{ row.icon }}"></i></div>
            <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font:500 10.5px/1 Outfit,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--cp-ink-3)">{{ row.k }}</span><span style="font:600 13px/1.3 Outfit,'Noto Sans Tamil',sans-serif;color:var(--cp-ink)">{{ row.v }}</span><sc-if value="{{ row.sub }}"><span style="font:500 12.5px/1.25 Outfit,sans-serif;color:var(--cp-ink-2)">{{ row.sub }}</span></sc-if></div>
          </div>
        </sc-for>
        <sc-if value="{{ aiThinking }}">
          <div style="display:flex;gap:5px;padding:16px 0 0 52px"><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-dots 1s infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-dots 1s .15s infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-dots 1s .3s infinite"></span></div>
        </sc-if>
      </div>
      <sc-if value="{{ aiDone }}">
        <button onClick="{{ aiNext }}" style="position:absolute;left:16px;right:16px;bottom:34px;height:60px;border-radius:999px;background:{{ aiBtnBg }};color:{{ aiBtnFg }};border:1px solid var(--cp-line);box-shadow:0 2px 0 var(--cp-edge),0 8px 14px -10px rgb(0 0 0 / .25);font:600 16px/1 Outfit,sans-serif;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;animation:cp-pop .45s cubic-bezier(.3,1.5,.5,1) both" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold {{ aiBtnIcon }}" style="font-size:21px"></i>{{ aiBtnLabel }}</button>
      </sc-if>
    </div>
    </sc-if>
