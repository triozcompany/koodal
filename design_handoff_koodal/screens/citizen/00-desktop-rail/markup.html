<!-- Koodal Citizen.dc.html · <sc-if value="{{ railShown }}"> · chars 8420–12253 -->
<sc-if value="{{ railShown }}"><nav data-cp-theme="dark" style="position:sticky;top:0;height:100vh;flex:none;width:{{ railW }};box-sizing:border-box;padding:18px 12px 16px;display:flex;flex-direction:column;gap:6px;background:#000;border-right:1px solid #1a1a1a;z-index:20">
 <button onClick="{{ toggleRail }}" onMouseEnter="{{ logoIn }}" onMouseLeave="{{ logoOut }}" title="{{ railTip }}" style="position:relative;display:flex;align-items:center;gap:10px;padding:6px;margin:0 2px 12px;border:none;border-radius:14px;background:{{ logoBg }};color:var(--cp-ink);cursor:{{ logoCur }};text-align:left;transition:background .2s"><span style="position:relative;width:36px;height:36px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform:{{ logoScale }}"><img src="assets/koodal-mark.png" alt="Koodal" style="position:absolute;width:28px;height:28px;object-fit:contain;opacity:{{ dotO }};transform:scale({{ dotS }});transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)"><i class="ph-bold {{ railIcon }}" style="position:absolute;font-size:16px;color:#0f0f0f;opacity:{{ icoO }};transform:{{ icoT }};transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)"></i></span><sc-if value="{{ railLabels }}"><span style="flex:1;font:700 18px/1 Outfit,sans-serif;letter-spacing:.06em;white-space:nowrap">KOODAL</span><i class="ph-bold ph-sidebar-simple" style="font-size:18px;color:var(--cp-ink-3);margin-right:4px;opacity:{{ icoO }};transform:translateX({{ sideX }});transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)"></i></sc-if></button>
 <button data-glare="1" onClick="{{ goReport }}" title="Report an issue" style="display:flex;align-items:center;justify-content:center;gap:9px;height:52px;margin:0 2px 14px;border-radius:999px;background:var(--cp-ink);color:var(--cp-bg);border:1px solid var(--cp-line);box-shadow:0 8px 18px -8px rgb(0 0 0 / .45),inset 0 1px 0 rgb(255 255 255 / .14);font:600 15px/1 Outfit,sans-serif;letter-spacing:.01em;cursor:pointer;white-space:nowrap" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-camera" style="font-size:21px"></i><sc-if value="{{ railLabels }}">Report issue</sc-if></button>
 <sc-for list="{{ dnav }}" as="n"><button onClick="{{ n.go }}" title="{{ n.l }}" style="position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:none;border-radius:999px;background:{{ n.bg }};color:{{ n.c }};font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;text-align:left" style-hover="background:var(--cp-surface-2)"><i class="{{ n.icon }}" style="font-size:22px"></i><sc-if value="{{ railLabels }}"><span style="flex:1">{{ n.l }}</span></sc-if><sc-if value="{{ n.badge }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:var(--cp-pulse);color:#fff;font:700 11px/20px Outfit,sans-serif;text-align:center;position:{{ n.bp }};top:3px;right:4px">{{ n.badge }}</span></sc-if></button></sc-for>
 <div style="flex:1"></div>
 <button onClick="{{ goProfilePage }}" title="Profile" style="display:flex;align-items:center;gap:12px;height:46px;padding:0 11px;border:none;border-radius:999px;background:{{ profNavBg }};color:var(--cp-ink);font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;text-align:left;transition:background .15s" style-hover="background:var(--cp-surface-2)"><span style="position:relative;width:28px;height:28px;flex:none;border-radius:50%;background:var(--cp-marigold);color:var(--cp-on-marigold);font:400 11px/28px 'DM Serif Display',serif;text-align:center;box-shadow:0 0 0 2px {{ profRing }}">{{ meI }}</span><sc-if value="{{ railLabels }}"><span style="flex:1;white-space:nowrap">Profile</span></sc-if></button></nav></sc-if>
