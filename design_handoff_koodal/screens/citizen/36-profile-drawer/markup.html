:column;gap:3px"><span style="font:600 13.5px/1.1 Outfit,sans-serif">{{ r.l }}</span><span style="font:500 12px/1.2 Outfit,sans-serif;color:var(--cp-ink-3)">{{ r.sub }}</span></span><sc-if value="{{ r.n }}"><span style="font:600 12px/1 Outfit,sans-serif;color:var(--cp-ink-2)">{{ r.n }}</span></sc-if><i class="ph-bold ph-caret-right" style="color:var(--cp-ink-3)"></i></button></sc-for><button data-glare="1" onClick="{{ goProfilePage }}" style="margin-top:4px;height:48px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 14px/1 Outfit,sans-serif;letter-spacing:.01em;cursor:pointer;transition:transform .12s" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent">View profile</button><sc-if value="{{ isMobile }}"><div style="width:40px;height:5px;border-radius:3px;background:var(--cp-line);margin:6px auto 0"></div></sc-if></div></sc-if>
