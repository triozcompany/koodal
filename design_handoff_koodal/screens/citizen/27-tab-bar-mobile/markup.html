<sc-if value="{{ showTabs }}"><div data-cp-theme="dark" style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#000;border-top:1px solid #1a1a1a;z-index:10;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:start;padding-top:10px;box-sizing:border-box">
 <sc-for list="{{ tabsL }}" as="t"><button onClick="{{ t.go }}" style="position:relative;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.c }};font:600 9.5px/1 Outfit,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer"><i class="{{ t.icon }}" style="font-size:24px"></i>{{ t.label }}<sc-if value="{{ t.badge }}"><span style="position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--cp-pulse);color:#fff;font:700 11px/18px Outfit,sans-serif;text-align:center">{{ t.badge }}</span></sc-if></button></sc-for>
 <button data-glare="1" onClick="{{ goReport }}" title="Report" style="justify-self:center;margin-top:-24px;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2e2e2e,#060606 72%);border:1.5px solid #3a3a3a;box-shadow:0 0 0 5px #000,0 0 28px 2px rgb(255 255 255 / .16);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:28px;transition:transform .12s" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-camera"></i></button>
 <sc-for list="{{ tabsR }}" as="t"><button onClick="{{ t.go }}" style="position:relative;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ t.c }};font:600 9.5px/1 Outfit,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer"><i class="{{ t.icon }}" style="font-size:24px"></i>{{ t.label }}<sc-if value="{{ t.badge }}"><span style="position:absolute;top:-4px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--cp-pulse);color:#fff;font:700 11px/18px Outfit,sans-serif;text-align:center">{{ t.badge }}</span></sc-if></button></sc-for></div></sc-if>
