
<div data-cp-theme="light" style="min-height:100vh;background:var(--cp-bg);color:var(--cp-ink);font-family:Outfit,system-ui,sans-serif">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;top:16px;left:50%;z-index:120;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--cp-ink);color:var(--cp-bg);font:600 12.5px/1.2 Outfit,sans-serif;max-width:calc(100vw - 32px);box-sizing:border-box;animation:cp-toast .35s cubic-bezier(.2,.9,.3,1.3) both;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)"><i class="ph-fill ph-check-circle" style="color:var(--cp-leaf);font-size:17px;flex:none"></i>{{ toast }}</div></sc-if><sc-if value="{{ tourOpen }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;inset:0;z-index:140;background:var(--cp-bg);color:var(--cp-ink);overflow-y:auto;animation:cp-sheet .4s cubic-bezier(.2,.9,.3,1.05) both"><div style="position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:64px;padding:0 16px;background:var(--cp-bg);border-bottom:1px solid var(--cp-line)"><button onClick="{{ closeTour }}" title="Back" style="width:40px;height:40px;flex:none;border-radius:50%;border:none;background:var(--cp-surface-2);color:var(--cp-ink);cursor:pointer;font-size:18px" style-active="transform:scale(.92)"><i class="ph-bold ph-caret-left"></i></button><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:600 15px/1.1 Outfit,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ tourT }}</span><span style="font:500 12px/1 Outfit,sans-serif;color:var(--cp-ink-3)">{{ tourRef }}</span></span></div><div style="max-width:880px;margin:0 auto;padding:22px 16px 64px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box"><div style="display:flex;flex-direction:column;gap:6px"><span style="font:400 30px/1.05 'DM Serif Display',serif;letter-spacing:-.02em">Photos</span><span style="font:500 13px/1.4 Outfit,sans-serif;color:var(--cp-ink-2)">{{ tourSub }}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><sc-for list="{{ tourPhotos }}" as="p"><div style="position:relative;grid-column:{{ p.span }};aspect-ratio:{{ p.ar }};border-radius:14px;overflow:hidden;background:repeating-linear-gradient({{ p.ang }},var(--cp-ph-a) 0 12px,var(--cp-ph-b) 12px 24px);animation:cp-row .35s ease-out both"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 11px/1 Outfit,sans-serif;color:var(--cp-ink-2);background:var(--cp-surface);padding:6px 9px;border-radius:6px;white-space:nowrap">{{ p.cap }}</span><span style="position:absolute;left:10px;bottom:10px;height:24px;padding:0 9px;border-radius:8px;background:rgb(0 0 0 / .55);color:#fff;font:600 11.5px/24px Outfit,sans-serif">{{ p.meta }}</span></div></sc-for></div></div></div></sc-if>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
 <sc-if value="{{ isDesk }}"><div style="display:flex;min-height:100vh"><!-- SLICE: 00-desktop-rail --><main style="flex:1;min-width:0;position:relative"><!-- SLICE: 01-home-desktop --><!-- SLICE: 02-feed-desktop --><!-- SLICE: 03-search-desktop --><!-- SLICE: 04-issue-detail-desktop --><!-- SLICE: 05-cases-desktop --><!-- SLICE: 06-profile-desktop --><!-- SLICE: 07-settings-desktop --></main></div></sc-if>
 <sc-if value="{{ showStage }}"><sc-if value="{{ isDesk }}"><div onClick="{{ closeFlow }}" style="position:fixed;inset:0;z-index:50;background:var(--cp-scrim);backdrop-filter:blur(6px) saturate(120%);-webkit-backdrop-filter:blur(6px) saturate(120%);animation:cp-row .2s both"></div></sc-if>
  <div style="position:fixed;left:{{ stL }};top:{{ stT }};width:{{ stW }};height:{{ stH }};transform:{{ stTf }};border-radius:{{ stR }};box-shadow:{{ stShadow }};overflow:hidden;background:var(--cp-bg);z-index:51;isolation:isolate;animation:{{ stAnim }}">
