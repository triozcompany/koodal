<!-- Koodal Citizen.dc.html · <sc-if value="{{ isSimM }}"> · chars 212415–217566 -->
<sc-if value="{{ isSimM }}">
    <div style="position:absolute;inset:0;padding:16px 20px 0;display:flex;flex-direction:column;gap:14px;animation:cp-in .38s cubic-bezier(.2,.9,.25,1.1) both">
      <div style="display:flex;align-items:center;height:44px"><button onClick="{{ goAiBack }}" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));border:1px solid var(--cp-line);box-shadow:0 2px 0 var(--cp-edge),0 8px 14px -10px rgb(0 0 0 / .25);color:var(--cp-ink);display:grid;place-items:center;cursor:pointer;font-size:19px" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold {{ flowBackIcon }}"></i></button></div>
      <div style="font:400 28px/1.02 'DM Serif Display',serif;letter-spacing:-.03em">{{ simTitle }}</div>
      <div style="position:relative;height:270px;margin:2px 0">
        <div style="position:absolute;left:18px;top:24px;width:170px;height:220px;border-radius:18px;border:1px solid var(--cp-line);overflow:hidden;background:repeating-linear-gradient(135deg,var(--cp-ph-a) 0 8px,var(--cp-ph-b) 8px 16px);box-shadow:0 1px 2px rgb(0 0 0 / .05);transform:{{ mineT }};opacity:{{ mineO }};transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .5s .35s;z-index:2">
          <span style="position:absolute;left:10px;top:10px;height:24px;padding:0 9px;border-radius:7px;background:var(--cp-ink);color:var(--cp-bg);font:700 11.5px/24px Outfit,sans-serif;white-space:nowrap">{{ mineTag }}</span>
        </div>
        <div style="position:absolute;right:18px;top:12px;width:170px;height:220px;border-radius:18px;border:1px solid var(--cp-line);overflow:hidden;background:repeating-linear-gradient(135deg,var(--cp-ph-a) 0 8px,var(--cp-ph-b) 8px 16px);box-shadow:0 1px 2px rgb(0 0 0 / .05);transform:{{ theirsT }};transition:transform .5s cubic-bezier(.3,1.5,.5,1) .6s">
          <span style="position:absolute;left:10px;top:10px;height:24px;padding:0 9px;border-radius:7px;background:var(--cp-marigold);color:var(--cp-on-marigold);font:700 11.5px/24px Outfit,sans-serif;white-space:nowrap">{{ m.by }} · {{ m.h }}h</span>
          <sc-if value="{{ joining }}"><span style="position:absolute;right:10px;bottom:10px;height:28px;padding:0 10px;border-radius:9px;background:var(--cp-pulse);color:#fff;font:700 12px/28px Outfit,sans-serif;animation:cp-pop .4s .9s cubic-bezier(.3,1.6,.5,1) both;white-space:nowrap">+1 photo</span></sc-if>
        </div>
        <div style="position:absolute;left:50%;top:96px;margin-left:-40px;width:80px;height:80px;border-radius:50%;background:{{ badgeBg }};color:var(--cp-on-marigold);border:3px solid var(--cp-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;animation:cp-pop .5s .2s cubic-bezier(.3,1.6,.5,1) both;opacity:{{ badgeO }};transition:opacity .3s">
          <span style="font:400 23px/1 'DM Serif Display',serif;letter-spacing:-.03em">{{ m.score }}%</span><span style="font:600 10px/1 Outfit,sans-serif">match</span>
        </div>
      </div>
      <div style="font:600 14px/1.25 Outfit,sans-serif">{{ m.title }}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;background:var(--cp-surface-2);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-map-pin"></i>{{ m.dist }} m apart</span>
        <span style="display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;background:var(--cp-surface-2);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-users"></i>{{ m.sup }} supporters</span>
        <sc-if value="{{ simOthers }}"><span style="display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;background:var(--cp-peacock-soft);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-intersect"></i>{{ simOthers }} similar reports merged</span></sc-if>
      </div>
      <div style="position:absolute;left:16px;right:16px;bottom:30px;display:flex;flex-direction:row-reverse;gap:10px">
        <button data-glare="1" onClick="{{ simPrimary }}" style="flex:7;min-width:0;white-space:nowrap;height:56px;border-radius:999px;background:var(--cp-ink);color:var(--cp-bg);border:1px solid var(--cp-line);box-shadow:0 8px 18px -8px rgb(0 0 0 / .45),inset 0 1px 0 rgb(255 255 255 / .14);font:600 16px/1 Outfit,sans-serif;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold {{ simPIcon }}" style="font-size:21px"></i>{{ simPLabel }}</button>
        <button onClick="{{ simSecondary }}" style="flex:3;min-width:0;height:56px;border:1px solid var(--cp-line);border-radius:999px;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cp-ink-2);font:600 13px/1 Outfit,sans-serif;cursor:pointer">{{ simSLabel }}</button>
      </div>
    </div>
    </sc-if>
