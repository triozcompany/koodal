<!-- Koodal Citizen.dc.html · <sc-if value="{{ isTimeline }}"> · chars 226157–230278 -->
<sc-if value="{{ isTimeline }}">
    <div style="position:absolute;inset:0;animation:cp-in .38s cubic-bezier(.2,.9,.25,1.1) both">
      <div style="position:absolute;inset:0;overflow-y:auto;padding:16px 20px 130px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:12px;height:44px">
          <button onClick="{{ goDetail }}" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));border:1px solid var(--cp-line);box-shadow:0 2px 0 var(--cp-edge),0 8px 14px -10px rgb(0 0 0 / .25);color:var(--cp-ink);display:grid;place-items:center;cursor:pointer;font-size:19px;flex:none" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-arrow-left"></i></button>
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font:600 12px/1 Outfit,sans-serif;color:var(--cp-ink-3)">{{ d.caseOrId }}</span><span style="font:700 14px/1.2 Outfit,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.title }}</span></div>
        </div>
        <div style="display:flex;gap:4px;margin:4px 0 10px"><sc-for list="{{ d.bar }}" as="b"><span style="flex:1;height:8px;border-radius:3px;background:{{ b.c }};transition:background .5s"></span></sc-for></div>
        <div style="position:relative;display:flex;flex-direction:column">
          <sc-for list="{{ events }}" as="e">
            <div style="position:relative;display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:18px;animation:{{ e.anim }}">
              <div style="position:relative;display:flex;justify-content:center">
                <sc-if value="{{ e.line }}"><div style="position:absolute;top:26px;bottom:-18px;width:2px;background:var(--cp-ink)"></div></sc-if>
                <div style="position:relative;width:26px;height:26px;border-radius:9px;background:{{ e.bg }};display:grid;place-items:center;z-index:1">
                  <sc-if value="{{ e.live }}"><div style="position:absolute;inset:0;border-radius:9px;background:{{ e.bg }};animation:cp-ping 1.6s ease-out infinite;z-index:-1"></div></sc-if>
                  <i class="ph-bold {{ e.icon }}" style="font-size:13px;color:{{ e.fg }}"></i>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:5px;padding:{{ e.pad }};border-radius:14px;background:{{ e.cardBg }}">
                <span style="font:500 11px/1 Outfit,sans-serif;color:var(--cp-ink-3)">{{ e.t }}</span>
                <span style="font:600 14px/1.25 Outfit,sans-serif">{{ e.title }}</span>
                <sc-if value="{{ e.sub }}"><span style="font:500 12px/1.3 Outfit,sans-serif;color:var(--cp-ink-2)">{{ e.sub }}</span></sc-if>
                <sc-if value="{{ e.photo }}"><div style="margin-top:4px;height:88px;width:150px;border-radius:12px;background:repeating-linear-gradient(135deg,var(--cp-ph-a) 0 7px,var(--cp-ph-b) 7px 14px);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box"><span style="font:500 9.5px/1 Outfit,sans-serif;color:var(--cp-ink-2)">{{ e.photo }}</span></div></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{ d.actVerify }}">
        <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 32px;background:var(--cp-bg);border-top:1px solid var(--cp-line);animation:cp-sheet .45s cubic-bezier(.2,.9,.3,1.1) both">
          <button data-glare="1" onClick="{{ goVerify }}" style="width:100%;height:60px;border-radius:999px;background:var(--cp-leaf);color:#fff;border:1px solid var(--cp-line);box-shadow:0 8px 18px -8px rgb(0 0 0 / .45),inset 0 1px 0 rgb(255 255 255 / .14);font:600 16px/1 Outfit,sans-serif;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-seal-check" style="font-size:21px"></i>Check the fix</button>
        </div>
      </sc-if>
    </div>
    </sc-if>
