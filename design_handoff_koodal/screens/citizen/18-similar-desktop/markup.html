<sc-if value="{{ isSimD }}"><div style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cp-surface);animation:cp-in .35s cubic-bezier(.2,.9,.25,1.1) both"><button onClick="{{ closeFlow }}" title="Close" style="position:absolute;right:18px;top:18px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);display:grid;place-items:center;cursor:pointer;font-size:16px" style-active="transform:scale(.92)"><i class="ph-bold ph-x"></i></button>
 <div style="display:flex;flex-direction:column;gap:10px;padding:32px 36px 20px;flex:none"><span style="display:flex;align-items:center;gap:7px;font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)"><i class="ph-bold ph-intersect" style="color:var(--cp-peacock);font-size:13px"></i>Similar issue found</span><span style="font:400 32px/1.1 'DM Serif Display',serif;letter-spacing:-.02em;max-width:640px">{{ simTitle }}</span></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:76px;height:76px;border-radius:50%;background:var(--cp-ink);color:var(--cp-bg);display:grid;place-items:center;box-shadow:0 0 0 8px var(--cp-surface),0 0 0 9px var(--cp-line);animation:cp-pop .45s cubic-bezier(.3,1.6,.5,1) both"><span style="display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font:700 20px/1 Outfit,sans-serif">{{ m.score }}%</span><span style="font:500 10px/1 Outfit,sans-serif;opacity:.7">match</span></span></div></div>

 </div>
 <div style="display:flex;flex-direction:column;gap:12px;padding:20px 36px;border-top:1px solid var(--cp-line);flex:none"><span style="font:600 18px/1.3 Outfit,sans-serif">{{ m.title }}</span><div style="display:flex;flex-wrap:wrap;gap:8px"><span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--cp-surface-2);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-map-pin"></i>{{ m.dist }} m apart</span><span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--cp-surface-2);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-users"></i>{{ m.sup }} citizens support</span><sc-if value="{{ simOthers }}"><span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--cp-peacock-soft);font:600 12.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold ph-intersect"></i>{{ simOthers }} reports merged</span></sc-if></div></div>
 <div style="display:flex;gap:12px;padding:18px 36px 26px;border-top:1px solid var(--cp-line);flex:none"><button onClick="{{ simSecondary }}" style="flex:3 1 0;min-width:0;height:52px;border-radius:999px;border:1px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font:600 14px/1 Outfit,sans-serif;cursor:pointer">{{ simSLabel }}</button><button data-glare="1" onClick="{{ simPrimary }}" style="flex:7 1 0;min-width:0;height:52px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 15px/1 Outfit,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:0 18px;overflow:hidden" style-active="transform:scale(.97)"><i class="ph-bold {{ simPIcon }}" style="flex:none"></i><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">{{ simPLabel }}</span></button></div>
