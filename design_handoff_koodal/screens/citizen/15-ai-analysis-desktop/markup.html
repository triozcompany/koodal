<!-- Koodal Citizen.dc.html · <sc-if value="{{ isAiD }}"> · chars 203221–208431 -->
<sc-if value="{{ isAiD }}"><div style="position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);background:var(--cp-surface);animation:cp-in .35s cubic-bezier(.2,.9,.25,1.1) both">
 <div style="position:relative;background:#0c0d10;display:flex;flex-direction:column;gap:14px;padding:28px;min-height:0">
  <div style="position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(135deg,#1b1d22 0 12px,#16181c 12px 24px)">
   <span style="position:absolute;left:14px;top:14px;height:28px;padding:0 11px;border-radius:999px;background:rgb(0 0 0 / .55);color:#fff;font:600 11.5px/28px Outfit,sans-serif;white-space:nowrap">your photo</span>
   <sc-if value="{{ aiScanning }}"><div style="position:absolute;inset:18% 22%;border:2px dashed rgb(255 255 255 / .55);border-radius:16px;animation:cp-ping 1.6s ease-out infinite"></div></sc-if>
   <sc-if value="{{ aiBox }}"><div style="position:absolute;inset:22% 26%;border:2.5px solid oklch(0.8 0.155 75);border-radius:14px;box-shadow:0 0 0 999px rgb(0 0 0 / .28);animation:cp-pop .4s cubic-bezier(.3,1.6,.5,1) both"><span style="position:absolute;left:-2px;top:-34px;height:26px;padding:0 10px;border-radius:999px;background:oklch(0.8 0.155 75);color:#0f0f0f;font:700 12px/26px Outfit,sans-serif;white-space:nowrap">{{ an.label }} · {{ an.p }}%</span></div></sc-if>
  </div>
  <div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none"><sc-for list="{{ shotList }}" as="s"><div style="flex:none;width:52px;height:52px;border-radius:10px;background:repeating-linear-gradient(135deg,#2a2c33 0 6px,#1f2126 6px 12px);display:grid;place-items:center;color:#c9cbd2;font-size:18px"><i class="ph-bold {{ s.icon }}"></i></div></sc-for></div>
 </div>
 <div style="position:relative;display:flex;flex-direction:column;min-height:0"><button onClick="{{ closeFlow }}" title="Close" style="position:absolute;right:18px;top:18px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);display:grid;place-items:center;cursor:pointer;font-size:16px" style-active="transform:scale(.92)"><i class="ph-bold ph-x"></i></button>
  <div style="display:flex;flex-direction:column;gap:10px;padding:32px 32px 18px;flex:none"><span style="display:flex;align-items:center;gap:7px;font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)"><i class="ph-fill ph-sparkle" style="color:var(--cp-pulse);font-size:13px"></i>AI analysis</span><span style="font:400 30px/1.1 'DM Serif Display',serif;letter-spacing:-.02em;padding-right:48px">{{ aiTitle }}</span></div>
  <div style="flex:1;overflow-y:auto;padding:0 32px;display:flex;flex-direction:column"><sc-for list="{{ aiRows }}" as="row"><div style="display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--cp-line);animation:cp-row .35s ease-out both"><div style="width:40px;height:40px;border-radius:50%;background:{{ row.bg }};display:grid;place-items:center;font-size:18px"><i class="ph-bold {{ row.icon }}"></i></div><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)">{{ row.k }}</span><span style="font:600 15px/1.3 Outfit,'Noto Sans Tamil',sans-serif">{{ row.v }}</span><sc-if value="{{ row.sub }}"><span style="font:400 13px/1.4 Outfit,sans-serif;color:var(--cp-ink-2)">{{ row.sub }}</span></sc-if></div></div></sc-for>
   <sc-if value="{{ aiThinking }}"><div style="display:flex;gap:6px;padding:18px 0 18px 54px;border-top:1px solid var(--cp-line)"><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-ping 1.2s ease-out infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-ping 1.2s .2s ease-out infinite"></span><span style="width:7px;height:7px;border-radius:50%;background:var(--cp-ink-3);animation:cp-ping 1.2s .4s ease-out infinite"></span></div></sc-if></div>
  <div style="display:flex;gap:12px;padding:18px 32px 26px;border-top:1px solid var(--cp-line);flex:none"><button onClick="{{ closeFlow }}" style="flex:3 1 0;min-width:0;height:52px;border-radius:999px;border:1px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font:600 14px/1 Outfit,sans-serif;cursor:pointer">Cancel</button><sc-if value="{{ aiDone }}"><button data-glare="1" onClick="{{ aiNext }}" style="flex:7 1 0;min-width:0;height:52px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 15px/1 Outfit,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;animation:cp-pop .35s cubic-bezier(.3,1.6,.5,1) both" style-active="transform:scale(.97)"><i class="ph-bold {{ aiBtnIcon }}"></i>{{ aiBtnLabel }}</button></sc-if><sc-if value="{{ aiThinking }}"><div style="flex:7 1 0;height:52px;border-radius:999px;background:var(--cp-surface-2);color:var(--cp-ink-3);font:600 14px/52px Outfit,sans-serif;text-align:center">Understanding…</div></sc-if></div>
 </div></div></sc-if>
