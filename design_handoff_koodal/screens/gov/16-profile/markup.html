<!-- Koodal Government.dc.html · <sc-if value="{{ isProfile }}"> · chars 129704–133820 -->
<sc-if value="{{ isProfile }}"><div style="max-width:1080px;margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;gap:20px;animation:cp-in .35s cubic-bezier(.2,.9,.25,1.1) both;box-sizing:border-box">
 <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-family:'DM Serif Display',serif;font-weight:400;font-size:{{ h1 }};line-height:1.05;letter-spacing:-.03em">{{ tr.profile }}</span><div style="flex:1"></div><button onClick="{{ goSettings }}" style="height:44px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,var(--cp-surface),var(--cp-surface-2));border:1px solid var(--cp-line);box-shadow:0 2px 0 var(--cp-edge),0 8px 14px -10px rgb(0 0 0 / .25);color:var(--cp-ink);font:600 13px/1 Outfit,sans-serif;cursor:pointer;display:flex;gap:8px;align-items:center"><i class="ph-bold ph-gear-six"></i>{{ tr.settings }}</button></div>
 <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:22px;border-radius:24px;background:var(--cp-surface);border:1px solid var(--cp-line)"><span style="width:88px;height:88px;flex:none;border-radius:50%;background:var(--cp-marigold);color:#0f0f0f;font:400 34px/88px 'DM Serif Display',serif;text-align:center">{{ me.ini }}</span><div style="flex:1 1 240px;display:flex;flex-direction:column;gap:7px;min-width:0"><span style="display:flex;align-items:center;gap:7px;font:700 22px/1.15 Outfit,sans-serif">{{ me.name }}<i class="ph-fill ph-seal-check" style="color:var(--cp-peacock);font-size:20px"></i></span><span style="font:500 14px/1.35 Outfit,sans-serif;color:var(--cp-ink-2)">{{ me.title }} · {{ me.role }}</span><span style="display:flex;align-items:center;gap:6px;font:500 13px/1.35 Outfit,sans-serif;color:var(--cp-ink-3)"><i class="ph-bold ph-bank"></i>{{ me.dept }} · {{ corpL }}</span></div><span style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--cp-peacock-soft);color:var(--cp-ink);font:600 12px/1 Outfit,sans-serif"><i class="ph-fill ph-shield-check" style="color:var(--cp-peacock)"></i>Verified official</span></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax({{ kpiMin }},1fr));gap:12px"><sc-for list="{{ myStats }}" as="k"><div style="display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line)"><span style="font:400 32px/1 'DM Serif Display',serif">{{ k.v }}</span><span style="font:600 13px/1.2 Outfit,sans-serif">{{ k.l }}</span><span style="font:500 12px/1.2 Outfit,sans-serif;color:var(--cp-ink-3)">{{ k.s }}</span></div></sc-for></div>
 <div style="display:grid;grid-template-columns:{{ insCols }};gap:20px;align-items:start">
  <div style="display:flex;flex-direction:column;padding:6px 18px;border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line)"><sc-for list="{{ meInfo }}" as="f"><div style="display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--cp-line)"><span style="font:500 13px/1.3 Outfit,sans-serif;color:var(--cp-ink-3);flex:none">{{ f.k }}</span><span style="font:600 13px/1.3 Outfit,sans-serif;text-align:right;min-width:0">{{ f.v }}</span></div></sc-for></div>
  <div style="display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--cp-surface);border:1px solid var(--cp-line)"><span style="font:400 20px/1 'DM Serif Display',serif">Assigned area</span><span style="font:500 13px/1.4 Outfit,sans-serif;color:var(--cp-ink-2)">{{ me.zone }}</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ meAreas }}" as="a"><button onClick="{{ a.go }}" style="display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font:600 12.5px/1 Outfit,sans-serif;cursor:pointer"><i class="ph-fill ph-map-pin" style="color:var(--cp-pulse)"></i>{{ a.l }}<span style="color:var(--cp-ink-3);font-weight:500">{{ a.n }}</span></button></sc-for></div></div>
 </div>
</div></sc-if>
