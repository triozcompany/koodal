<sc-if value="{{ mobChrome }}"><div data-cp-theme="dark" style="position:fixed;left:0;right:0;bottom:0;z-index:40;height:76px;padding-bottom:env(safe-area-inset-bottom);background:#000;border-top:1px solid #1a1a1a;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center"><sc-for list="{{ nav }}" as="n"><button onClick="{{ n.go }}" style="position:relative;height:100%;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:{{ n.c }};font:600 9.5px/1 Outfit,'Noto Sans Tamil',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer"><i class="{{ n.icon }}" style="font-size:23px"></i>{{ n.l }}<sc-if value="{{ n.badge }}"><span style="position:absolute;top:10px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--cp-marigold);color:#0f0f0f;font:700 11px/18px Outfit,sans-serif;text-align:center;padding:0 4px;box-sizing:border-box">{{ n.badge }}</span></sc-if></button></sc-for></div></sc-if>
