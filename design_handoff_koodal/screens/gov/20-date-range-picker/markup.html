<!-- Koodal Government.dc.html · <sc-if value="{{ dp.open }}"> · chars 142891–149189 -->
<sc-if value="{{ dp.open }}"><div onClick="{{ dp.close }}" style="position:fixed;inset:0;z-index:105;background:{{ dp.scrim }};backdrop-filter:blur(6px) saturate(120%);-webkit-backdrop-filter:blur(6px) saturate(120%);animation:cp-row .2s both"><div onClick="{{ stop }}" style="position:fixed;left:{{ dp.l }};right:{{ dp.r }};top:{{ dp.t }};bottom:{{ dp.b }};width:{{ dp.w }};max-height:{{ dp.maxH }};overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:20px;padding:{{ dp.pad }};box-sizing:border-box;background:var(--cp-surface);border-radius:{{ dp.rad }};border:1px solid var(--cp-line);box-shadow:0 30px 70px -22px rgb(0 0 0 / .45);animation:{{ dp.anim }}">
 <sc-if value="{{ mob }}"><div style="width:40px;height:5px;border-radius:3px;background:var(--cp-line);margin:-8px auto -6px;flex:none"></div></sc-if>
 <div style="display:flex;justify-content:center"><div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--cp-surface-2)"><sc-for list="{{ dp.tabs }}" as="t"><button onClick="{{ t.pick }}" style="height:40px;padding:0 24px;border-radius:999px;border:none;background:{{ t.bg }};color:{{ t.fg }};font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;box-shadow:{{ t.sh }};transition:all .2s;white-space:nowrap" style-active="transform:scale(.95)">{{ t.l }}</button></sc-for></div></div>
 <sc-if value="{{ dp.isDates }}">
  <div style="display:grid;grid-template-columns:{{ dp.cols }};gap:32px"><sc-for list="{{ dp.months }}" as="m"><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div style="display:grid;grid-template-columns:36px 1fr 36px;align-items:center"><sc-if value="{{ m.showPrev }}"><button onClick="{{ dp.prev }}" title="Previous month" style="width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--cp-ink);cursor:pointer;font-size:15px" style-hover="background:var(--cp-surface-2)"><i class="ph-bold ph-caret-left"></i></button></sc-if><sc-if value="{{ m.noPrev }}"><span></span></sc-if><span style="text-align:center;font:600 15px/1 Outfit,sans-serif">{{ m.title }}</span><sc-if value="{{ m.showNext }}"><button onClick="{{ dp.next }}" title="Next month" disabled="{{ dp.nextDis }}" style="width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--cp-ink);cursor:pointer;font-size:15px" style-hover="background:var(--cp-surface-2)"><i class="ph-bold ph-caret-right"></i></button></sc-if></div>
   <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))"><sc-for list="{{ dp.wd }}" as="w"><span style="text-align:center;font:600 11px/1 Outfit,sans-serif;color:var(--cp-ink-3);padding:4px 0">{{ w.l }}</span></sc-for></div>
   <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px"><sc-for list="{{ m.days }}" as="dd"><button onClick="{{ dd.pick }}" disabled="{{ dd.dis }}" style="height:44px;border:none;padding:0;background:{{ dd.band }};border-radius:{{ dd.bandR }};cursor:{{ dd.cur }};opacity:1;filter:none"><span style="display:grid;place-items:center;width:42px;max-width:100%;height:42px;margin:1px auto;border-radius:50%;background:{{ dd.bg }};color:{{ dd.fg }};font:600 13px/1 Outfit,sans-serif;text-decoration:{{ dd.td }};box-shadow:{{ dd.ring }};transition:background .15s">{{ dd.n }}</span></button></sc-for></div></div></sc-for></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;border-radius:16px;border:1px solid var(--cp-line);overflow:hidden"><sc-for list="{{ dp.boxes }}" as="bx"><div style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;box-shadow:{{ bx.sh }};border-radius:16px;background:var(--cp-surface)"><span style="font:600 10.5px/1 Outfit,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cp-ink-3)">{{ bx.l }}</span><span style="font:600 14px/1 Outfit,sans-serif;color:{{ bx.c }}">{{ bx.v }}</span></div></sc-for></div>
 </sc-if>
 <sc-if value="{{ dp.isQuick }}">
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px"><span style="font:600 16px/1.2 Outfit,sans-serif;text-align:center">How far back should we look?</span><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px"><sc-for list="{{ dp.quick }}" as="q"><button onClick="{{ q.pick }}" style="height:44px;padding:0 18px;border-radius:999px;border:1.5px solid {{ q.bd }};background:{{ q.bg }};color:var(--cp-ink);font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:all .15s" style-active="transform:scale(.95)">{{ q.l }}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px"><span style="font:600 16px/1.2 Outfit,sans-serif;text-align:center">Or pick whole months</span><div style="display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:2px 2px 6px;box-sizing:border-box"><sc-for list="{{ dp.monthsQ }}" as="mq"><button onClick="{{ mq.pick }}" style="flex:none;width:118px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:18px;border:{{ mq.bd }};background:{{ mq.bg }};color:var(--cp-ink);cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)" style-active="transform:scale(.95)"><i class="ph-bold {{ mq.icon }}" style="font-size:30px"></i><span style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font:600 14px/1 Outfit,sans-serif">{{ mq.m }}</span><span style="font:500 12px/1 Outfit,sans-serif;color:var(--cp-ink-3)">{{ mq.y }}</span></span></button></sc-for></div></div>
 </sc-if>
 <div style="display:flex;align-items:center;gap:12px;padding-top:4px"><button onClick="{{ dp.clear }}" style="height:44px;padding:0 6px;border:none;background:none;color:var(--cp-ink);font:600 13.5px/1 Outfit,sans-serif;cursor:pointer;text-decoration:underline;white-space:nowrap">Clear</button><span style="flex:1;text-align:center;font:500 12.5px/1.3 Outfit,sans-serif;color:var(--cp-ink-3)">{{ dp.hint }}</span><button data-glare="1" onClick="{{ dp.apply }}" style="height:48px;padding:0 24px;border-radius:999px;border:none;background:var(--cp-ink);color:var(--cp-bg);font:600 14px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap" style-active="transform:translateY(2px) scale(.97)">Apply</button></div>
</div></div></sc-if>
