
<div data-cp-theme="{{ theme }}" style="min-height:100vh;background:var(--cp-bg);color:var(--cp-ink);font-family:Outfit,system-ui,sans-serif">
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:fixed;top:16px;left:50%;z-index:150;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--cp-ink);color:var(--cp-bg);font:600 12.5px/1.25 Outfit,sans-serif;max-width:calc(100vw - 32px);box-sizing:border-box;animation:cp-toast .35s cubic-bezier(.2,.9,.3,1.3) both;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)"><i class="ph-fill ph-check-circle" style="color:var(--cp-leaf);font-size:17px;flex:none"></i>{{ toast }}</div></sc-if>
<!-- SLICE: 00-login -->
