 <div style="max-width:880px;margin:0 auto;padding:22px {{ tourPad }} 64px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box"><div style="display:flex;flex-direction:column;gap:6px"><span style="font:400 30px/1.05 'DM Serif Display',serif;letter-spacing:-.02em">Evidence photos</span><span style="font:500 13px/1.4 Outfit,sans-serif;color:var(--cp-ink-2)">{{ d.photoN }} photos from {{ d.contribN }} citizens · geotagged within 50 m · identities hidden</span></div>
