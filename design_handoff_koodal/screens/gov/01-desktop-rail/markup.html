<!-- Koodal Government.dc.html · <sc-if value="{{ showRail }}"> · chars 13021–16964 -->
<sc-if value="{{ showRail }}"><nav data-cp-theme="dark" style="position:sticky;top:0;height:100vh;flex:none;width:{{ railW }};box-sizing:border-box;padding:18px 12px 16px;display:flex;flex-direction:column;gap:6px;background:#000;border-right:1px solid #1a1a1a;z-index:20;transition:width .3s cubic-bezier(.2,.9,.3,1)">
  <button onClick="{{ toggleRail }}" onMouseEnter="{{ logoIn }}" onMouseLeave="{{ logoOut }}" title="{{ railTip }}" style="position:relative;display:flex;align-items:center;gap:10px;padding:6px;margin:0 2px 18px;border:none;border-radius:14px;background:{{ logoBg }};color:#f5f5f5;cursor:{{ logoCur }};text-align:left;transition:background .2s"><span style="position:relative;width:36px;height:36px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden"><img src="assets/koodal-mark.png" alt="Koodal" style="position:absolute;width:28px;height:28px;object-fit:contain;opacity:{{ markO }};transform:scale({{ markS }});transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)"><i class="ph-bold ph-sidebar-simple" style="position:absolute;font-size:17px;color:#0f0f0f;opacity:{{ sideO }};transform:scale({{ sideS }});transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)"></i></span><sc-if value="{{ railLabels }}"><span style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font:700 18px/1 Outfit,sans-serif;letter-spacing:.06em">KOODAL</span><span style="font:600 9px/1 Outfit,sans-serif;letter-spacing:.22em;color:var(--cp-marigold)">GOVERNMENT</span></span><i class="ph-bold ph-sidebar-simple" style="font-size:18px;color:#7c7c7c;margin-right:4px;opacity:{{ collO }};transition:opacity .2s"></i></sc-if></button>
  <sc-for list="{{ nav }}" as="n"><button onClick="{{ n.go }}" title="{{ n.l }}" style="position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:none;border-radius:999px;background:{{ n.bg }};color:{{ n.c }};font:600 13.5px/1 Outfit,'Noto Sans Tamil',sans-serif;cursor:pointer;text-align:left;white-space:nowrap" style-hover="background:var(--cp-surface-2)" style-active="transform:scale(.97)"><i class="{{ n.icon }}" style="font-size:22px"></i><sc-if value="{{ railLabels }}"><span style="flex:1">{{ n.l }}</span></sc-if><sc-if value="{{ n.badge }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:var(--cp-marigold);color:#0f0f0f;font:700 11px/20px Outfit,sans-serif;text-align:center;position:{{ n.bp }};top:3px;right:4px">{{ n.badge }}</span></sc-if></button></sc-for>
  <div style="flex:1"></div>
  <button onClick="{{ goSettings }}" title="{{ tr.settings }}" style="display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:none;border-radius:999px;background:{{ setBg }};color:{{ setC }};font:600 13.5px/1 Outfit,'Noto Sans Tamil',sans-serif;cursor:pointer;text-align:left;white-space:nowrap" style-hover="background:var(--cp-surface-2)"><i class="ph-bold ph-gear-six" style="font-size:22px"></i><sc-if value="{{ railLabels }}">{{ tr.settings }}</sc-if></button>
  <button onClick="{{ goProfile }}" title="{{ tr.profile }}" style="display:flex;align-items:center;gap:12px;height:52px;padding:0 9px;border:none;border-radius:999px;background:{{ profBg }};color:#f5f5f5;font:600 13px/1.1 Outfit,sans-serif;cursor:pointer;text-align:left" style-hover="background:var(--cp-surface-2)"><span style="width:34px;height:34px;flex:none;border-radius:50%;background:var(--cp-marigold);color:#0f0f0f;font:400 13px/34px 'DM Serif Display',serif;text-align:center">{{ me.ini }}</span><sc-if value="{{ railLabels }}"><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ me.name }}</span><span style="font:500 11px/1 Outfit,sans-serif;color:#8a8a8a;white-space:nowrap">{{ me.title }}</span></span></sc-if></button>
 </nav></sc-if>
