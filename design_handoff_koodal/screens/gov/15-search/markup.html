<!-- Koodal Government.dc.html · <sc-if value="{{ isSearch }}"> · chars 122700–129703 -->
<sc-if value="{{ isSearch }}"><div style="max-width:1000px;margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;gap:16px;animation:cp-in .35s cubic-bezier(.2,.9,.25,1.1) both;box-sizing:border-box">
 <div style="display:flex;align-items:center;gap:14px;min-height:44px"><span style="font-family:'DM Serif Display',serif;font-weight:400;font-size:{{ sH1 }};line-height:1.05;letter-spacing:-.03em">{{ tr.search }}</span></div>
 <div style="display:flex;gap:8px;align-items:center"><div style="flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--cp-line);background:var(--cp-surface);box-shadow:0 1px 2px rgb(0 0 0 / .05)"><i class="ph-bold ph-magnifying-glass" style="font-size:18px"></i><input ref="{{ sRef }}" value="{{ sq }}" onChange="{{ onSq }}" onKeyDown="{{ onSqKey }}" placeholder="Case ID, street, area, problem, team…" style="flex:1;min-width:0;border:none;background:none;outline:none;color:var(--cp-ink);font:500 14px/1 Outfit,sans-serif"><sc-if value="{{ sq }}"><button onClick="{{ clearSq }}" style="width:26px;height:26px;border-radius:50%;border:none;background:var(--cp-surface-2);color:var(--cp-ink-2);cursor:pointer;display:grid;place-items:center"><i class="ph-bold ph-x" style="font-size:11px"></i></button></sc-if></div><button onClick="{{ openCF }}" title="Filters" style="flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;height:48px;min-width:48px;padding:0 16px;border-radius:999px;border:1px solid {{ cfBd }};background:{{ cfBgS }};color:{{ cfFg }};font:600 13px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;box-sizing:border-box;box-shadow:0 2px 0 var(--cp-edge),0 8px 14px -10px rgb(0 0 0 / .25)" style-active="transform:translateY(2px) scale(.985);box-shadow:0 0 0 transparent"><i class="ph-bold ph-sliders-horizontal" style="font-size:16px"></i><sc-if value="{{ notMob }}">Filters</sc-if><sc-if value="{{ cfN }}"><span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:var(--cp-pulse);color:#fff;font:700 11px/20px Outfit,sans-serif;text-align:center">{{ cfN }}</span></sc-if></button></div>
 <sc-if value="{{ hasActiveF }}"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><sc-for list="{{ activeF }}" as="a"><button onClick="{{ a.clear }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--cp-line);background:var(--cp-surface-2);color:var(--cp-ink);font:600 12px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap"><span style="color:var(--cp-ink-3)">{{ a.k }}</span>{{ a.l }}<i class="ph-bold ph-x" style="font-size:11px"></i></button></sc-for><button onClick="{{ clearF }}" style="height:32px;padding:0 8px;border:none;background:none;color:var(--cp-pulse);font:600 12px/1 Outfit,sans-serif;cursor:pointer">Clear all</button></div></sc-if>
 <sc-if value="{{ sEmpty }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;flex-direction:column;gap:10px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)">Recent</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ recentL }}" as="r"><button onClick="{{ r.pick }}" style="display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font:600 12.5px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;flex:none"><i class="ph-bold ph-clock-counter-clockwise" style="color:var(--cp-ink-3)"></i>{{ r.l }}</button></sc-for></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><span style="font:600 11px/1 Outfit,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cp-ink-3)">Try</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ trySugg }}" as="r"><button onClick="{{ r.pick }}" style="display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:none;background:var(--cp-surface-2);color:var(--cp-ink);font:600 12.5px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;flex:none"><i class="ph-bold {{ r.icon }}"></i>{{ r.l }}</button></sc-for></div></div>
 </div></sc-if>
 <sc-if value="{{ sHas }}"><div style="display:flex;flex-direction:column;gap:22px">
  <span style="font:600 12px/1 Outfit,sans-serif;color:var(--cp-ink-3)">{{ sCount }}</span>
  <sc-if value="{{ sAreasHas }}"><div style="display:flex;flex-direction:column;gap:10px"><span style="font:400 18px/1 'DM Serif Display',serif">Areas &amp; departments</span><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ sAreas }}" as="a"><button onClick="{{ a.go }}" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;border:1px solid var(--cp-line);background:var(--cp-surface);color:var(--cp-ink);font:600 13px/1 Outfit,sans-serif;cursor:pointer;white-space:nowrap;flex:none"><i class="ph-bold {{ a.icon }}" style="color:var(--cp-ink-3)"></i>{{ a.l }}<span style="font:500 12px/1 Outfit,sans-serif;color:var(--cp-ink-3);white-space:nowrap;flex:none">{{ a.n }} cases</span></button></sc-for></div></div></sc-if>
  <sc-if value="{{ sCasesHas }}"><div style="display:flex;flex-direction:column;border-radius:20px;border:1px solid var(--cp-line);background:var(--cp-surface);overflow:hidden"><sc-for list="{{ sRows }}" as="r"><div onClick="{{ r.open }}" style="display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--cp-line);cursor:pointer" style-hover="background:var(--cp-bg)"><div style="width:42px;height:42px;border-radius:13px;background:var(--cp-ink);display:grid;place-items:center"><i class="ph-bold {{ r.icon }}" style="font-size:20px;color:var(--cp-bg)"></i></div><div style="display:flex;flex-direction:column;gap:5px;min-width:0"><span style="font:500 12px/1.1 Outfit,sans-serif;color:var(--cp-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:var(--cp-ink-2)">{{ r.ref }}</span> · {{ r.street }} · {{ r.dept }}</span><span style="font:600 14px/1.25 Outfit,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span></div><span style="display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:{{ r.sbg }};color:{{ r.sfg }};font:600 11.5px/1 Outfit,sans-serif;white-space:nowrap"><i class="ph-bold {{ r.sico }}"></i>{{ r.slShort }}</span></div></sc-for></div></sc-if>
  <sc-if value="{{ sNone }}"><div style="padding:40px 16px;text-align:center;color:var(--cp-ink-3);font:600 13px/1.5 Outfit,sans-serif">No cases match “{{ sq }}”.<br>Only community-created cases are searchable here.</div></sc-if>
 </div></sc-if>
</div></sc-if>
